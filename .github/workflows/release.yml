name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: install linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: install NSIS (windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      - name: build
        run: cargo build --release

      - name: package linux (.deb + .tar.gz)
        if: runner.os == 'Linux'
        run: |
          VER="${GITHUB_REF_NAME#v}"; VER="${VER:-0.1.0}"
          PKG="distdeb/eduway_${VER}_amd64"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/share/applications" "$PKG/usr/share/icons/hicolor/256x256/apps" dist
          cp target/release/eduway "$PKG/usr/bin/"
          cp assets/eduway.desktop "$PKG/usr/share/applications/eduway.desktop"
          cp assets/icon-256.png "$PKG/usr/share/icons/hicolor/256x256/apps/eduway.png"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: eduway
          Version: $VER
          Section: education
          Priority: optional
          Architecture: amd64
          Depends: libssl3
          Maintainer: eduway <noreply>
          Description: Download your Edunex courses from the terminal.
          EOF
          dpkg-deb --build "$PKG" "dist/eduway-Linux.deb"
          cp target/release/eduway README.md edunex-protocol.md assets/eduway.desktop assets/icon-256.png dist/
          cd dist && tar czf eduway-Linux.tar.gz eduway README.md edunex-protocol.md eduway.desktop icon-256.png && rm -f eduway README.md edunex-protocol.md eduway.desktop icon-256.png

      - name: package windows (NSIS setup + zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist, installer\windows\stage
          copy target\release\eduway.exe installer\windows\stage\
          copy assets\icon.ico installer\windows\stage\
          copy README.md installer\windows\stage\
          cd installer\windows
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = "makensis" }
          & $makensis eduway.nsi
          move eduway-Windows-Setup.exe ..\..\dist\
          cd ..\..
          Compress-Archive -Path target\release\eduway.exe -DestinationPath dist\eduway-Windows.zip

      - name: package macos (.dmg + .tar.gz)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist Eduway.app/Contents/MacOS Eduway.app/Contents/Resources
          cp target/release/eduway Eduway.app/Contents/MacOS/
          cp installer/macos/Info.plist Eduway.app/Contents/
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon-512.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) assets/icon-512.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o Eduway.app/Contents/Resources/icon.icns
          hdiutil create -volname Eduway -srcfolder Eduway.app -ov -format UDZO dist/eduway-macOS.dmg
          cp target/release/eduway README.md edunex-protocol.md assets/eduway.desktop assets/icon-256.png dist/
          cd dist && tar czf eduway-macOS.tar.gz eduway README.md edunex-protocol.md eduway.desktop icon-256.png && rm -f eduway README.md edunex-protocol.md eduway.desktop icon-256.png

      - uses: actions/upload-artifact@v4
        with:
          name: eduway-${{ runner.os }}
          path: dist/

  github-release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
